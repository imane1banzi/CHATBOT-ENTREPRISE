<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot Support</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#343541] text-white h-screen flex">

  <!-- Sidebar -->
  <div class="w-64 bg-[#202123] p-4 hidden md:flex flex-col gap-4">
    <h2 class="text-lg font-bold">🤖 Support IT</h2>

    <button onclick="newChat()"
            class="w-full bg-[#343541] p-2 rounded hover:bg-gray-700">
      + Nouvelle discussion
    </button>

    <div>
      <h3 class="text-sm font-semibold text-gray-300 mb-2">📚 Base de connaissances</h3>

      <label class="block w-full text-center bg-green-600 p-2 rounded cursor-pointer hover:bg-green-700">
        📄 Importer un PDF
        <input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple class="hidden"
               onchange="uploadPdfs(this.files)">
      </label>

      <p id="uploadStatus" class="text-xs text-gray-400 mt-2"></p>

      <ul id="docList" class="mt-2 space-y-1 text-xs text-gray-300"></ul>
    </div>
  </div>

  <!-- Main -->
  <div class="flex-1 flex flex-col">

    <!-- Messages -->
    <div id="chat" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

    <!-- Input -->
    <div class="p-4 bg-[#40414f] flex">
      <input id="message"
             class="flex-1 p-3 rounded bg-[#343541] outline-none"
             placeholder="Pose ta question..."
             onkeypress="handleKeyPress(event)" />

      <button onclick="sendMessage()"
              class="ml-3 bg-green-500 px-4 py-2 rounded hover:bg-green-600">
        Envoyer
      </button>
    </div>

  </div>

<script>
const chat = document.getElementById("chat");

// Crée une bulle de message (textContent : pas d'injection HTML)
function createBubble(text, sender, extraClass = "") {
  const wrapper = document.createElement("div");
  wrapper.className = sender === "user" ? "text-right" : "text-left";

  const bubble = document.createElement("div");
  bubble.className = "inline-block px-4 py-2 rounded-lg max-w-xl whitespace-pre-line text-left " +
    (extraClass || (sender === "user" ? "bg-green-500" : "bg-[#444654]"));
  bubble.textContent = text;

  wrapper.appendChild(bubble);
  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addSources(bubble, sources) {
  if (!sources || !sources.length) return;
  const box = document.createElement("div");
  box.className = "mt-2 pt-2 border-t border-gray-500 text-xs text-gray-300";
  box.textContent = "📎 Sources : " + sources.join(" · ");
  bubble.appendChild(box);
}

// Envoyer un message
window.sendMessage = async function () {
  const input = document.getElementById("message");
  const message = input.value;
  if (!message.trim()) return;

  createBubble(message, "user");
  input.value = "";

  const bubble = createBubble("...", "bot");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message })
    });
    const data = await res.json();
    bubble.textContent = data.answer;
    addSources(bubble, data.sources);
  } catch (err) {
    bubble.className = bubble.className.replace("bg-[#444654]", "bg-red-500");
    bubble.textContent = "Erreur serveur 😢";
  }

  chat.scrollTop = chat.scrollHeight;
};

// Import de PDF
window.uploadPdfs = async function (files) {
  const status = document.getElementById("uploadStatus");

  for (const file of files) {
    status.textContent = `⏳ Indexation de ${file.name}...`;
    const form = new FormData();
    form.append("file", file);

    try {
      const res = await fetch("/upload", { method: "POST", body: form });
      const data = await res.json();
      status.textContent = res.ok
        ? `✅ ${data.name} indexé (${data.chunks} passages)`
        : `❌ ${data.detail}`;
    } catch (err) {
      status.textContent = `❌ Échec de l'import de ${file.name}`;
    }
  }

  document.getElementById("pdfInput").value = "";
  loadDocuments();
};

// Liste des documents indexés
async function loadDocuments() {
  const list = document.getElementById("docList");
  try {
    const res = await fetch("/documents");
    const data = await res.json();
    list.innerHTML = "";
    if (!data.documents.length) {
      const li = document.createElement("li");
      li.className = "italic text-gray-500";
      li.textContent = "Aucun document";
      list.appendChild(li);
    }
    for (const doc of data.documents) {
      const li = document.createElement("li");
      li.className = "truncate";
      li.title = doc.name;
      li.textContent = "• " + doc.name;
      list.appendChild(li);
    }
  } catch (err) {
    list.textContent = "";
  }
}

// Touche Entrée
window.handleKeyPress = function (event) {
  if (event.key === "Enter") sendMessage();
};

// Nouvelle discussion
window.newChat = function () {
  if (confirm("Voulez-vous démarrer une nouvelle discussion ?")) {
    chat.innerHTML = "";
  }
};

loadDocuments();
</script>

</body>
</html>
